<!DOCTYPE html>
<html>
<head>
    <title>Order Form</title>
</head>

<body>

    <h1>HABI & HUE Order Form</h1>

    <p>
        Fill out the form below to order
        your favorite handmade product.
    </p>

    <hr>

    <form>

        <h3>Customer Information</h3>

        Full Name:
        <input type="text" name="fullname">

        <br><br>

        Contact Number:
        <input type="text" name="contact">

        <br><br>

        Email Address:
        <input type="email" name="email">

        <br><br>

        <h3>Order Details</h3>

        Select Product:

        <select name="product">

            <option>Crochet Bag</option>

            <option>Beaded Bracelet</option>

            <option>Personalized Keychain</option>

            <option>Handmade Gift Box</option>

        </select>

        <br><br>

        Quantity:

        <input type="number"
               name="quantity"
               min="1">

        <br><br>

        Preferred Color:

        <input type="text" name="color">

        <br><br>

        Payment Method:

        <br>

        <input type="radio"
               name="payment"
               value="cash">

        Cash on Delivery

        <br>

        <input type="radio"
               name="payment"
               value="gcash">

        GCash

        <br><br>

        Special Instructions:

        <br>

        <textarea name="instructions"
                  rows="4"
                  cols="30"></textarea>

        <br><br>

        <input type="submit"
               value="Place Order">

        <input type="reset"
               value="Clear Form">

    </form>

</body>
</html>
